name: Construire l'APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install

      - name: Assembler l'appli web
        run: npm run build

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk incollable-ma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: incollable-ma-apk
          path: incollable-ma.apk
