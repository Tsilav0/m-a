/* Layout : appli mobile une colonne — barre haute, zone de défilement, barre d'onglets en bas. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --surface-2: #E2E7EE;
  --ink: #0E1726;
  --ink-2: #4E5D72;
  --line: #D2D9E3;
  --accent: #0B6E5B;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3EEE6;
  --brass: #9C6B12;
  --brass-soft: #F3E5C6;
  --bad: #BE3A31;
  --bad-soft: #F8DEDA;
  --shadow: 0 1px 2px rgba(14, 23, 38, .06), 0 4px 14px rgba(14, 23, 38, .05);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1119; --surface: #131C27; --surface-2: #1C2734; --ink: #E6ECF3; --ink-2: #94A4B9; --line: #273446;
    --accent: #37B898; --accent-ink: #03150F; --accent-soft: #10332B; --brass: #E3B254; --brass-soft: #372B13;
    --bad: #F06C62; --bad-soft: #3A1A18; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1119; --surface: #131C27; --surface-2: #1C2734; --ink: #E6ECF3; --ink-2: #94A4B9; --line: #273446;
  --accent: #37B898; --accent-ink: #03150F; --accent-soft: #10332B; --brass: #E3B254; --brass-soft: #372B13;
  --bad: #F06C62; --bad-soft: #3A1A18; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack > *, .p-body > * { flex-shrink: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

/* Barre haute */
.top { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.top h1 { font-size: 24px; font-weight: 800; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 13px/1 var(--f-body); white-space: nowrap; }
.chip svg { width: 15px; height: 15px; }
.chip.brass { color: var(--brass); }
.chip.on { background: var(--brass-soft); border-color: transparent; }
.chip.good { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.icon-btn { width: 38px; height: 38px; border-radius: 99px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* Cartes */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card h2 { font-size: 19px; font-weight: 700; }
.card h3 { font-size: 16px; font-weight: 700; }

/* Boutons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-ink); font: 700 16px/1.2 var(--f-display); letter-spacing: .01em; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn:disabled { background: var(--surface-2); color: var(--ink-2); box-shadow: none; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.bad { background: var(--bad); color: var(--surface); box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.btn.brass { background: var(--brass); color: var(--bg); box-shadow: 0 3px 0 color-mix(in srgb, var(--brass) 60%, #000); }
.btn.sm { min-height: 40px; font-size: 14px; padding: 8px 14px; width: auto; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; }

/* Barres de progression */
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s ease; }
.bar.brass > i { background: var(--brass); }
.bar.thick { height: 14px; }

/* Onglets */
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px 6px; flex: none; }

<div id="app"></div>
<script>
/* Base du contenu : helpers pour déclarer unités, leçons et questions.
   Types de questions :
   - mcq   : QCM (o = options, a = index de la bonne réponse)
   - tf    : vrai / faux (a = true|false)
   - num   : réponse chiffrée (a = valeur, tol = tolérance absolue, u = unité)
   - ord   : remettre dans l'ordre (o = éléments dans le BON ordre)
   - open  : question d'entretien orale (r = réponse modèle, p = points clés attendus)
*/
window.MA = { units: [], sims: [], glossary: [] };
const mcq = (q, o, a, e) => ({ t: 'mcq', q, o, a, e });
const tf = (q, a, e) => ({ t: 'tf', q, a, e });
const num = (q, a, tol, u, e) => ({ t: 'num', q, a, tol, u, e });
const ord = (q, o, e) => ({ t: 'ord', q, o, e });
const open = (q, r, p) => ({ t: 'open', q, r, p });
MA.unit = function (u) { MA.units.push(u); };

MA.unit({
  id: 'u1', title: 'Fondamentaux du M&A', icon: '🤝',
  desc: 'Types d’opérations, acteurs, motivations, cadre français',
  lessons: [
    {
      id: 'u1l1', title: 'Les types d’opérations',
      cards: [
        ['Fusion vs acquisition', `Une <b>acquisition</b> : une société (l'acquéreur) prend le contrôle d'une autre (la cible). Une <b>fusion</b> : deux entités se combinent en une seule, souvent entre sociétés de taille comparable (« merger of equals »).<br><br>En pratique, la quasi-totalité des deals sont des acquisitions, même quand on les présente comme des fusions.`],
        ['Horizontal, vertical, conglomérat', `<ul><li><b>Horizontale</b> : même métier, même niveau de la chaîne de valeur (deux cimentiers). Objectif : taille, parts de marché, synergies de coûts.</li><li><b>Verticale</b> : amont ou aval (un constructeur rachète un fournisseur). Objectif : sécuriser l'approvisionnement, capter la marge.</li><li><b>Conglomérale</b> : activités sans lien. Objectif : diversification. Souvent sanctionnée par une décote de conglomérat.</li></ul>`],
        ['Opérations de LBO', `<ul><li><b>LBO</b> (Leveraged Buy-Out) : un fonds rachète une société en finançant une large part avec de la dette, remboursée par les cash-flows de la cible.</li><li><b>MBO</b> : le management en place rachète avec un fonds.</li><li><b>MBI</b> : une équipe de management externe entre.</li><li><b>OBO</b> : le dirigeant-actionnaire revend à une holding qu'il contrôle avec un fonds, pour sécuriser une partie de son patrimoine.</li><li><b>Secondary / tertiary LBO</b> : un fonds revend à un autre fonds.</li></ul>`],
        ['Cessions et séparations', `<ul><li><b>Carve-out</b> : cession d'une division (ou introduction en bourse d'une partie de celle-ci).</li><li><b>Spin-off</b> : la division est distribuée aux actionnaires existants, qui reçoivent des titres de la nouvelle entité. Pas de cash pour la maison mère.</li><li><b>Joint-venture</b> : deux partenaires créent une entité commune.</li></ul>`],
        ['Share deal vs asset deal', `<b>Share deal</b> : on achète les titres → on récupère la société avec tout son historique (passif caché compris). Simple, transfert automatique des contrats.<br><br><b>Asset deal</b> : on achète des actifs choisis (fonds de commerce, brevets, usine). L'acheteur choisit ce qu'il reprend, mais les contrats doivent souvent être transférés un par un et la fiscalité diffère (droits d'enregistrement).`]
      ],
      qs: [
        mcq('Un constructeur automobile rachète son fournisseur de batteries. Type d’opération ?', ['Horizontale', 'Verticale', 'Conglomérale', 'Spin-off'], 1, 'Le fournisseur est en amont dans la chaîne de valeur : intégration verticale.'),
        mcq('Le dirigeant actionnaire majoritaire revend sa société à une holding qu’il contrôle avec un fonds. C’est un :', ['MBI', 'OBO', 'Spin-off', 'Carve-out'], 1, 'OBO (Owner Buy-Out) : le dirigeant « se revend » sa société pour encaisser une partie de la valeur tout en gardant le contrôle.'),
        tf('Dans un spin-off, la maison mère reçoit du cash de la part d’un acquéreur.', false, 'Dans un spin-off, les titres de la filiale sont distribués aux actionnaires existants : aucun cash n’est encaissé. C’est la différence avec une cession (carve-out).'),
        mcq('Dans un share deal, l’acheteur :', ['Choisit les actifs qu’il reprend', 'Reprend la société avec l’ensemble de ses passifs, y compris cachés', 'N’est jamais exposé au passé fiscal de la cible', 'Doit renégocier chaque contrat'], 1, 'L’acheteur reprend la personne morale entière, d’où l’importance de la due diligence et des garanties (GAP / indemnities) dans le SPA.'),
        mcq('Une équipe de managers externes entre au capital avec un fonds pour diriger la cible. C’est un :', ['MBO', 'MBI', 'OBO', 'BIMBO'], 1, 'MBI = Management Buy-In (management externe). MBO = management en place. BIMBO = combinaison des deux.'),
        tf('Une opération conglomérale vise principalement des synergies de coûts.', false, 'Sans lien entre les métiers, les synergies sont faibles. La logique est la diversification, et le marché applique souvent une décote de conglomérat.'),
        mcq('Quel avantage principal de l’asset deal pour l’acheteur ?', ['Transfert automatique des contrats', 'Choisir les actifs et laisser les passifs', 'Fiscalité toujours plus favorable', 'Process plus rapide'], 1, 'L’acheteur sélectionne ce qu’il reprend, ce qui limite le risque de passifs cachés. En contrepartie, le transfert des contrats est plus lourd.'),
        open('Quelle est la différence entre un share deal et un asset deal ? Quand privilégier l’un ou l’autre ?', 'Share deal : achat des titres, on reprend la société entière avec son historique (actifs, passifs, contrats, risques). Simple et rapide, les contrats suivent automatiquement (sauf clauses de changement de contrôle). Asset deal : achat d’actifs sélectionnés ; l’acheteur évite les passifs non désirés mais doit transférer contrats et salariés et supporte des droits d’enregistrement plus élevés. On privilégie l’asset deal pour une division non filialisée, une société en difficulté (risques de passif) ou quand on ne veut qu’une partie de l’activité.', ['Share deal = titres, reprise du passif', 'Asset deal = sélection des actifs', 'Transfert des contrats (automatique vs un par un)', 'Différence de fiscalité / droits d’enregistrement', 'Cas d’usage : division non filialisée, société en difficulté']),
      ]

MA.unit({

        ['Deux grandes familles', `<b>Valorisation intrinsèque</b> : la valeur découle des flux futurs de la société → <b>DCF</b>.<br><b>Valorisation relative</b> : la valeur découle du prix d'actifs comparables → <b>comparables boursiers</b> (trading comps) et <b>transactions précédentes</b> (precedent transactions).<br>Plus des méthodes spécifiques : <b>LBO</b> (ce qu'un fonds peut payer), <b>ANR</b> (somme des parties, holdings, foncières), cours de bourse et objectifs de cours des analystes.`],

        ['La règle du P/E (paiement 100 % titres)', `Si le <b>P/E de l'acheteur > P/E payé pour la cible</b> → <b>relutif</b>.<br>Si le P/E de l'acheteur < P/E payé → <b>dilutif</b>.<br>Intuition : l'acheteur « paie » avec une monnaie chère (son action) pour acheter des bénéfices moins chers.`],
        ['Le coût des titres', `Le « coût » d'une action émise = le <b>rendement des bénéfices</b> de l'acheteur = <b>1 / P/E</b>.<br>P/E de 10x → coût des titres = 10 %. P/E de 20x → 5 %.`],
        ['La règle générale du coût d’acquisition', `Comparer :<br>• le <b>rendement de la cible</b> = RN cible / prix payé = 1 / P/E payé<br>• au <b>coût moyen pondéré</b> du financement : cash (taux × (1 − t)), dette (taux × (1 − t)), titres (1 / P/E acheteur).<br>Rendement de la cible > coût pondéré → <b>relutif</b>.`],
        ['Exemple', `Cible achetée à 15x (rendement 6,7 %).<br>Financement 50 % dette à 6 % (4,5 % après impôt) + 50 % titres à 10x (10 %) → coût pondéré = 7,25 %.<br>6,7 % < 7,25 % → <b>dilutif</b>.`]
      ],
      qs: [
        mcq('Acheteur à 20x P/E, cible achetée à 15x, paiement 100 % titres. Le deal est :', ['Relutif', 'Dilutif', 'Neutre', 'Impossible à dire'], 0, 'L’acheteur paie avec une monnaie plus chère (20x) pour des bénéfices moins chers (15x) : relutif.'),
        mcq('Acheteur à 12x P/E, cible achetée à 18x, paiement 100 % titres. Le deal est :', ['Relutif', 'Dilutif', 'Neutre', 'Impossible à dire'], 1, 'Le P/E payé dépasse celui de l’acheteur : dilutif.'),
        num('P/E de l’acheteur : 20x. Coût implicite du financement en titres (%) ?', 5, 0.01, '%', '1 / 20 = 5 %.'),
        num('Cible achetée à un P/E de 12,5x. Rendement des bénéfices de la cible (%) ?', 8, 0.01, '%', '1 / 12,5 = 8 %.'),
        mcq('Cible achetée à 10x (rendement 10 %). Financement 100 % dette à 8 % avant impôt, IS 25 %. Le deal est :', ['Relutif', 'Dilutif', 'Neutre', 'Impossible à dire'], 0, 'Coût après impôt 6 % < rendement 10 % : relutif.'),
        num('Financement 50 % dette à 6 % avant impôt (IS 25 %) et 50 % titres avec un P/E acheteur de 10x. Coût pondéré du financement (%, 2 décimales) ?', 7.25, 0.01, '%', '0,5 × 4,5 % + 0,5 × 10 % = 7,25 %.'),
        tf('À P/E identiques entre acheteur et cible, sans synergies, un deal 100 % titres est neutre sur le BPA.', true, 'Le coût des titres égale exactement le rendement des bénéfices acquis.'),
        open('Un acheteur avec un P/E de 15x rachète une cible à un P/E de 20x en titres. Relutif ou dilutif ? Et en dette ?', `En titres : dilutif, car l'acheteur émet des actions dont le coût implicite est 1/15 = 6,7 % pour acquérir des bénéfices qui rapportent 1/20 = 5 % du prix payé. En dette : cela dépend du coût de la dette après impôt. Si la dette coûte 5 % avant impôt avec 25 % d'IS, soit 3,75 % après impôt, inférieur à 5 %, le deal est relutif. Il faut aussi intégrer les synergies et les amortissements de PPA.`, ['Coût des titres = 1 / P/E acheteur', 'Rendement de la cible = 1 / P/E payé', 'Titres : dilutif', 'Dette : comparer au coût après impôt', 'Synergies / PPA']),
      ]
    },
    {
      id: 'u8l4', title: 'Goodwill et PPA',
      cards: [
        ['Purchase Price Allocation', `Lors d'une acquisition, l'acheteur réévalue à la <b>juste valeur</b> les actifs et passifs identifiables de la cible : marques, relations clients, brevets, stocks, immobilier… C'est la <b>PPA</b>.`],
        ['Le calcul du goodwill', `<b>Goodwill = Prix payé (equity) − Juste valeur des actifs nets identifiables</b><br>avec : juste valeur des actifs nets = actifs nets comptables + réévaluations − <b>impôt différé passif</b> sur les réévaluations.`],
        ['Exemple', `Prix payé 500. Actifs nets comptables 300. Réévaluation d'une marque : +50. IS 25 % → IDP 12,5.<br>Juste valeur des actifs nets = 300 + 50 − 12,5 = 337,5.<br>Goodwill = 500 − 337,5 = <b>162,5</b>.`],
        ['Ce que représente le goodwill', `Les éléments non identifiables séparément : synergies attendues, savoir-faire, équipes, position de marché, et… la prime éventuellement surpayée. Non amorti en IFRS, il est testé chaque année. Une dépréciation de goodwill signale souvent une acquisition <b>surpayée</b>.`],
        ['Badwill', `Si le prix est inférieur à la juste valeur des actifs nets → <b>badwill</b> (« bargain purchase ») : après vérification, le gain est reconnu immédiatement en résultat. Typique des rachats de sociétés en difficulté.`]
      ],
      qs: [
        num('Prix payé 500. Actifs nets comptables 300. Réévaluation de marque +50, IS 25 %. Goodwill ?', 162.5, 0.01, '', '500 − (300 + 50 − 12,5) = 162,5.'),
        num('Prix payé 800. Actifs nets comptables 500. Aucune réévaluation. Goodwill ?', 300, 0, '', '800 − 500 = 300.'),
        num('Prix payé 1 000. Actifs nets comptables 600. Réévaluation de 100 des immobilisations, IS 25 %. Goodwill ?', 325, 0, '', 'Juste valeur = 600 + 100 − 25 = 675 ; goodwill = 325.'),
        mcq('En IFRS, le goodwill :', ['Est amorti sur 20 ans', 'N’est pas amorti mais testé au moins une fois par an', 'Est passé en charge immédiatement', 'Est inscrit en capitaux propres'], 1, 'IAS 36 : test de dépréciation annuel (impairment test).'),
        mcq('Une dépréciation massive du goodwill signale souvent :', ['Une acquisition surpayée ou des synergies non réalisées', 'Une hausse du cours', 'Une meilleure trésorerie', 'Une erreur de l’auditeur'], 0, 'La valeur recouvrable de l’activité ne justifie plus le prix payé.'),
        tf('Les réévaluations d’actifs incorporels amortissables lors de la PPA réduisent le résultat net futur.', true, 'Elles créent des amortissements additionnels, ce qui pèse sur le BPA (et donc sur l’accretion / dilution).'),
        mcq('Un badwill (bargain purchase) est :', ['Amorti sur 5 ans', 'Comptabilisé en gain immédiatement en résultat', 'Ajouté au goodwill', 'Ignoré'], 1, 'Après vérification des justes valeurs, le profit est reconnu immédiatement au compte de résultat.'),
        open('Comment calcule-t-on le goodwill lors d’une acquisition ?', `Goodwill = prix payé pour les titres − juste valeur des actifs nets identifiables de la cible. On part des capitaux propres comptables, on retire le goodwill préexistant de la cible, on ajoute les réévaluations à la juste valeur (marques, relations clients, brevets, immobilier, stocks) et on retire l'impôt différé passif créé sur ces réévaluations. Le résiduel est le goodwill : synergies, savoir-faire, équipes, prime. En IFRS il n'est pas amorti mais testé chaque année ; s'il est négatif, c'est un badwill comptabilisé en résultat.`, ['Prix − juste valeur des actifs nets', 'Retirer le goodwill existant', 'Réévaluations (PPA)', 'Impôt différé passif', 'Pas d’amortissement / impairment test', 'Badwill']),
      ]
    }
  ]
});

MA.unit({
  id: 'u9', title: 'Fit & motivation', icon: '🎯',

  lessons: [
    {
      id: 'u9l1', title: 'Le pitch : « Walk me through your CV »',
      cards: [
        ['L’enjeu', `C'est presque toujours la <b>première question</b>. Elle donne le ton. Objectif : <b>90 secondes à 2 minutes</b>, une histoire cohérente qui mène logiquement au poste.`],
        ['La structure', `<ol><li><b>Accroche</b> : qui tu es en une phrase.</li><li><b>Parcours</b> : formation et expériences, en insistant sur les <b>choix</b> et ce que tu en as appris (pas une liste).</li><li><b>Le déclic</b> : ce qui t'a amené vers le M&A.</li><li><b>Aujourd'hui</b> : pourquoi ce poste, dans cette banque, maintenant.</li></ol>`],
        ['Les erreurs classiques', `<ul><li>Réciter le CV ligne par ligne.</li><li>Trop long (plus de 3 minutes).</li><li>Aucun fil conducteur.</li><li>Pas de lien avec le poste visé.</li><li>Négatif sur un ancien employeur.</li></ul>`],
        ['Valoriser une expérience post-trade', `Un passage en <b>securities services</b> (conservation, post-marché, actifs numériques) est un atout à présenter comme tel : compréhension de l'infrastructure des marchés et des contraintes des clients institutionnels, rigueur opérationnelle, exposition aux sujets de transformation (T+1, tokenisation) qui sont aussi des thèmes de M&A (consolidation des infrastructures de marché, acquisitions dans la fintech). Le déclic : passer de l'exécution des flux à la <b>décision stratégique</b> et à la valorisation.`]
      ],
      qs: [
        mcq('Durée idéale pour « walk me through your CV » :', ['20 secondes', '1 min 30 à 2 min', '5 à 7 minutes', 'Aussi long que nécessaire'], 1, 'Assez pour raconter une histoire, assez court pour laisser le recruteur rebondir.'),
        ord('Remets la structure du pitch dans l’ordre :', ['Accroche (qui tu es)', 'Parcours et choix', 'Le déclic vers le M&A', 'Pourquoi ce poste, maintenant']),
        mcq('Quelle est la meilleure façon de présenter tes expériences ?', ['Liste exhaustive des tâches', 'Les choix faits et ce que tu en as appris, en lien avec le M&A', 'Uniquement les notes obtenues', 'Ce que tu n’as pas aimé'], 1, 'Le recruteur cherche une logique de parcours et des compétences transférables.'),
        open('Walk me through your CV.', `Structure en 4 temps, 2 minutes maximum. Accroche : une phrase sur qui tu es (formation, spécialité). Parcours : chaque étape présentée comme un choix, avec ce qu'elle t'a apporté de concret et transférable (rigueur, modélisation, compréhension des marchés et des clients institutionnels). Le déclic : le moment où tu as compris que tu voulais travailler sur les décisions stratégiques et la valorisation (un deal suivi, un cours, une discussion). Aujourd'hui : pourquoi le M&A, pourquoi cette maison (secteurs, taille de deals, culture), pourquoi maintenant. Finir sur une phrase qui ouvre la discussion.`, ['Accroche en 1 phrase', 'Expériences = choix + apprentissages', 'Compétences transférables chiffrées', 'Déclic vers le M&A', 'Lien avec la banque visée', 'Moins de 2 à 3 minutes']),
        open('Tu viens du post-trade / securities services : pourquoi passer au M&A ?', `Partir du positif : le post-trade m'a donné une compréhension concrète de l'infrastructure des marchés, des contraintes des investisseurs institutionnels et des chantiers de transformation (T+1, actifs numériques). J'y ai développé rigueur, précision et capacité à gérer des volumes sous contrainte de délai, qui sont essentielles en M&A. Mais j'ai envie de passer de l'exécution des flux à la décision : comprendre pourquoi une entreprise se vend ou achète, la valoriser, construire l'equity story. Le déclic : un sujet ou deal concret observé (consolidation d'infrastructures de marché, rapprochements dans les services titres). Ce n'est pas une fuite, c'est une continuité : je comprends un secteur que beaucoup de candidats ne connaissent que de l'extérieur.`, ['Valoriser l’expérience (pas de fuite)', 'Compétences transférables : rigueur, volume, délais', 'Envie de stratégie et de valorisation', 'Exemple concret de déclic', 'Atout sectoriel (FIG, infrastructures de marché)']),
      ]
    },
    {
      id: 'u9l2', title: 'Pourquoi le M&A, pourquoi nous',
      cards: [
        ['« Pourquoi le M&A ? »', `Trois piliers :<ol><li><b>Le contenu</b> : décisions stratégiques majeures, variété des secteurs, rigueur technique (modélisation, valorisation).</li><li><b>L'apprentissage</b> : courbe d'apprentissage très rapide, exposition aux dirigeants.</li><li><b>Le concret</b> : un deal a un début et une fin, un impact réel sur des entreprises.</li></ol>Appuie chaque pilier sur une <b>expérience personnelle</b>. Évite « l'argent » et « le prestige ».`],
        ['« Pourquoi notre banque ? »', `Montre que tu as fait tes recherches : <b>positionnement</b> (bulge bracket, boutique, mid-cap), <b>secteurs forts</b>, <b>deals récents</b> (cite-en un ou deux que tu peux analyser), <b>taille des équipes</b> (plus de responsabilités dans une petite équipe), <b>personnes rencontrées</b> (afterworks, anciens). Une réponse qui marcherait pour toutes les banques est une mauvaise réponse.`],
        ['Connaître les métiers voisins', `<ul><li><b>ECM / DCM</b> : levées de fonds en actions / en dette.</li><li><b>Leveraged finance</b> : dette d'acquisition.</li><li><b>Transaction Services</b> : due diligence financière.</li><li><b>Private equity</b> : côté investisseur, horizon long, on vit avec les participations.</li><li><b>Corporate development</b> : M&A en interne chez un industriel.</li></ul>`],
        ['La question « et après ? »', `« Où te vois-tu dans 5 ans ? » : montre de l'ambition <b>dans le métier</b> (associate, prise de responsabilités, spécialisation sectorielle). Évoquer le PE est possible mais délicat : ne donne pas l'impression que la banque n'est qu'un tremplin.`]
      ],
      qs: [

        mcq('Quelle est la différence principale entre M&A et ECM ?', ['ECM conseille sur les fusions, M&A sur les IPO', 'M&A conseille sur les acquisitions/cessions, ECM sur les levées en actions (IPO, augmentations de capital)', 'Aucune', 'ECM ne concerne que la dette'], 1, 'ECM = Equity Capital Markets : IPO, augmentations de capital, placements accélérés.'),
        tf('Une bonne réponse à « Pourquoi notre banque ? » peut s’appliquer à n’importe quelle banque.', false, 'Elle doit être spécifique : deals récents, secteurs, positionnement, personnes rencontrées.'),
        mcq('Différence entre banquier M&A et investisseur en PE ?', ['Aucune', 'Le banquier conseille sur une transaction ; l’investisseur PE prend des participations et les gère sur plusieurs années', 'Le PE ne fait pas de valorisation', 'Le banquier investit son propre argent'], 1, 'Le conseil est rémunéré par des honoraires sur le deal ; le PE vise un rendement sur le capital investi et accompagne la participation.'),
        open('Pourquoi le M&A ?', `Trois raisons, chacune illustrée. 1) Le contenu : participer à des décisions qui transforment une entreprise, avec une forte exigence technique (valorisation, modélisation, structuration) ; exemple d'un cours, d'un stage ou d'un deal qui t'a marqué. 2) L'apprentissage : une courbe très rapide, la variété des secteurs et l'exposition à des dirigeants dès le début. 3) Le côté concret et collectif : un deal a un début, une fin, un résultat ; travailler en équipe sous pression m'a plu dans telle expérience. Montrer qu'on connaît la réalité du métier (horaires, exigence) et qu'on l'a choisie en connaissance de cause.`, ['Contenu stratégique et technique', 'Courbe d’apprentissage', 'Concret / travail d’équipe', 'Chaque point illustré par une expérience', 'Lucidité sur le rythme', 'Pas d’argent / prestige en argument']),
        open('Pourquoi notre banque plutôt qu’une autre ?', `Réponse en 3 temps et spécifique. 1) Positionnement : ce qui distingue la maison (boutique indépendante et absence de conflits d'intérêts, ou plateforme intégrée avec financement, ou spécialiste mid-cap avec des équipes réduites et donc plus de responsabilités). 2) Deals et secteurs : un ou deux deals récents que tu as étudiés et dont tu peux expliquer la logique, des secteurs forts qui t'intéressent. 3) Les gens : rencontres (forums, afterworks, anciens de ton école) et ce qu'elles t'ont appris de la culture. Conclure sur ce que tu peux apporter.`, ['Positionnement spécifique de la banque', 'Deals récents étudiés', 'Secteurs d’expertise', 'Rencontres / culture', 'Ce que j’apporte']),
        open('Où te vois-tu dans 5 ans ?', `Montrer de l'ambition dans le métier et de la cohérence : avoir progressé d'analyste à associate, maîtriser l'exécution de bout en bout, avoir développé une expertise sectorielle, commencer à encadrer des juniors et à être en contact direct avec les clients. Rester ouvert sans présenter la banque comme un tremplin vers autre chose.`, ['Progression dans le métier (associate)', 'Expertise sectorielle', 'Encadrement / relation client', 'Pas de « tremplin »']),
      ]
    },
    {
      id: 'u9l3', title: 'Questions comportementales',
      cards: [
        ['La méthode STAR', `<b>S</b>ituation : le contexte en une phrase.<br><b>T</b>âche : ton rôle, l'objectif.<br><b>A</b>ction : ce que <b>toi</b> tu as fait (dis « je », pas « on »).<br><b>R</b>ésultat : chiffré si possible, et ce que tu as appris.`],
        ['Prépare 5 histoires', `Prépare 5 histoires réutilisables qui couvrent : <b>leadership</b>, <b>travail d'équipe et conflit</b>, <b>échec</b>, <b>pression et délais</b>, <b>erreur et rigueur</b>. Une même histoire peut servir plusieurs questions.`],
        ['Forces et faiblesses', `<b>Force</b> : utile en M&A (rigueur, capacité de travail, esprit de synthèse), prouvée par un exemple.<br><b>Faiblesse</b> : réelle mais non rédhibitoire, avec ce que tu fais pour la corriger. À éviter : « je suis perfectionniste » sans plus, ou une faiblesse incompatible (« je déteste Excel »).`],
        ['L’échec', `Choisis un vrai échec, assume-le sans te victimiser, et insiste sur <b>ce que tu as appris</b> et <b>ce que tu fais différemment</b> depuis. C'est la maturité qui est évaluée.`]
      ],
      qs: [

        mcq('Quelle faiblesse est à éviter ?', ['« J’ai tendance à vouloir tout faire moi-même, j’apprends à déléguer »', '« Je n’aime pas le travail minutieux sur les chiffres »', '« Je manquais d’aisance à l’oral, j’ai rejoint une association de débat »', '« J’ai du mal à dire non, je priorise mieux maintenant »'], 1, 'La rigueur sur les chiffres est le cœur du métier d’analyste : faiblesse rédhibitoire.'),
        tf('Pour la question sur un échec, il vaut mieux choisir un faux échec qui est en réalité une réussite.', false, 'Les recruteurs repèrent ces réponses. Un vrai échec assumé, avec les leçons tirées, montre de la maturité.'),
        open('Parle-moi d’une fois où tu as travaillé sous une forte pression.', `Méthode STAR. Situation : contexte précis (projet, stage, association) avec une contrainte de délai forte. Tâche : ton rôle et l'enjeu. Action : comment tu as priorisé (urgent vs important), découpé le travail, communiqué avec l'équipe ou le manager sur l'avancement et les risques, gardé la qualité (double vérification des chiffres). Résultat : livrable rendu à temps, chiffré si possible, et ce que tu en as tiré (méthode de priorisation réutilisée depuis). Lien avec le M&A : délais serrés et exigence de zéro erreur.`, ['STAR complet', 'Priorisation', 'Communication avec le manager / l’équipe', 'Maintien de la qualité', 'Résultat et leçon', 'Lien avec le métier']),
        open('Quelle est ta plus grande faiblesse ?', `Choisir une faiblesse réelle, non rédhibitoire pour un analyste, et montrer le plan d'action. Exemple : « J'avais tendance à vouloir tout vérifier moi-même et à avoir du mal à déléguer ou à demander de l'aide, ce qui me faisait perdre du temps. En stage, j'ai appris à poser mes questions plus tôt, groupées, et à valider le format attendu avant de me lancer. » Être bref, sincère, et finir sur le progrès.`, ['Faiblesse réelle', 'Non rédhibitoire pour le poste', 'Exemple concret', 'Plan d’action', 'Progrès constaté']),
        open('Parle-moi d’un échec.', `Un vrai échec, avec une part de responsabilité personnelle, présenté en STAR : contexte, ce qui n'a pas marché, ta part de responsabilité sans accuser les autres, ce que tu as fait pour limiter les dégâts, et surtout ce que tu as appris et appliqué ensuite (exemple d'une situation ultérieure où tu as fait mieux). Ton posé, pas de dramatisation.`, ['Vrai échec, responsabilité assumée', 'Pas de reproche aux autres', 'Réaction immédiate', 'Leçon tirée', 'Application ultérieure']),
        open('Parle-moi d’un désaccord avec un membre de ton équipe.', `STAR : contexte précis et nature du désaccord (sur le fond, pas sur une personne). Action : j'ai écouté ses arguments, recherché les faits et les données, proposé une solution ou un compromis et, si besoin, escaladé de manière constructive. Résultat : décision prise, relation préservée, et ce que j'en ai retenu (désaccord exprimé tôt et factuellement). En M&A, savoir challenger un chiffre poliment est une qualité.`, ['Désaccord sur le fond', 'Écoute et faits', 'Solution / compromis', 'Relation préservée', 'Leçon']),
      ]
    },
    {
      id: 'u9l4', title: 'Culture deal et fin d’entretien',
      cards: [
        ['« Parle-moi d’un deal récent »', `Question quasi systématique. Prépare <b>2 à 3 deals</b> (un grand deal médiatisé, un deal du secteur de la banque, idéalement un deal sur lequel la banque a conseillé). Structure :<ol><li>Les <b>parties</b>, le <b>montant</b>, le <b>multiple</b>.</li><li>La <b>logique stratégique</b>.</li><li>Le <b>financement</b> et la structure.</li><li>Ton <b>avis</b> : bon deal ou pas, risques.</li></ol>`],
        ['Suivre l’actualité', `Lis chaque jour les rubriques deals de la presse financière (Les Échos, Financial Times, l'Agefi) et des newsletters M&A. Note dans un carnet : parties, montant, multiple, conseils, logique. Et fais le lien avec les <b>taux d'intérêt</b>, qui conditionnent les volumes de LBO et les valorisations.`],
        ['« As-tu des questions ? »', `Ne jamais répondre non. Bonnes questions : le staffing (secteurs, généraliste ou spécialisé), la place donnée aux analystes sur les deals, un deal récent de l'équipe, le parcours du recruteur, ce qui distingue les meilleurs analystes. À éviter : salaire, vacances et horaires au premier tour, et tout ce qui est sur le site.`],
        ['Le jour J', `Arrive en avance, connais le nom de tes interlocuteurs, aie ton CV en tête dans le détail (tout ce qui y est écrit peut être questionné), parle chiffres. Si tu ne sais pas une réponse technique : raisonne à voix haute, ne bluffe jamais.`]
      ],
      qs: [

        mcq('À la question « As-tu des questions ? », quelle réponse est la meilleure ?', ['« Non, tout est clair »', '« Quel est le salaire ? »', '« Comment les analystes sont-ils staffés et quelle place ont-ils dans la relation client ? »', '« Combien de jours de vacances ? »'], 2, 'Une question sur le fonctionnement concret montre ton intérêt pour le métier.'),

MA.unit({
  id: 'u11', title: 'Technical interview in English', icon: '🇬🇧',

    {
      id: 'u11l1', title: 'Key vocabulary',
      cards: [
        ['Accounting', `Chiffre d'affaires = <b>revenue</b> (ou sales) · Résultat net = <b>net income</b> · Capitaux propres = <b>shareholders' equity</b> · BFR = <b>net working capital</b> · Créances clients = <b>accounts receivable</b> · Dettes fournisseurs = <b>accounts payable</b> · Stocks = <b>inventory</b> · Réserves = <b>retained earnings</b> · Immobilisations corporelles = <b>PP&E</b>.`],
        ['Valuation & deals', `Valeur d'entreprise = <b>enterprise value</b> · Dette nette = <b>net debt</b> · Intérêts minoritaires = <b>non-controlling interests</b> · Prime de contrôle = <b>control premium</b> · Relutif / dilutif = <b>accretive / dilutive</b> · BPA = <b>EPS</b> · TRI = <b>IRR</b> · Contrat de cession = <b>SPA</b> · Conditions suspensives = <b>conditions precedent (CPs)</b> · Garantie d'actif et de passif ≈ <b>indemnity / warranties</b>.`],
        ['Phrases utiles', `• « Let me walk you through it step by step. »<br>• « Assuming a 25% tax rate… »<br>• « It depends on… but generally… »<br>• « Could you clarify whether… ? »<br>• « The key driver here is… »`]
      ],
      qs: [
        mcq('« Créances clients » en anglais :', ['Accounts payable', 'Accounts receivable', 'Accrued expenses', 'Deferred revenue'], 1, 'Accounts receivable = ce que les clients doivent. Accounts payable = ce que l’on doit aux fournisseurs.'),
        mcq('« Intérêts minoritaires » en anglais :', ['Minority shareholders loan', 'Non-controlling interests', 'Preferred equity', 'Treasury shares'], 1, 'Non-controlling interests (NCI), anciennement minority interest.'),
        mcq('« Conditions suspensives » en anglais :', ['Covenants', 'Conditions precedent', 'Earn-out', 'Break fee'], 1, 'Conditions precedent (CPs) : conditions à lever avant le closing.'),
        mcq('« Relutif » en anglais :', ['Dilutive', 'Accretive', 'Accrued', 'Additive'], 1, 'Accretive = augmente le BPA (EPS) pro forma.'),
        mcq('« Réserves » (bénéfices non distribués) en anglais :', ['Retained earnings', 'Reserves for losses', 'Paid-in capital', 'Goodwill'], 0, 'Retained earnings = résultats cumulés non distribués.'),
        mcq('« BFR » en anglais :', ['Free cash flow', 'Net working capital', 'Capex', 'Gross margin'], 1, 'Net working capital (NWC).'),
      ]
    },
    {
      id: 'u11l2', title: 'Classic questions in English',
      cards: [
        ['Comment répondre en anglais', `Mêmes structures qu'en français, phrases courtes, et annonce ton plan : « There are three main methods… First… Second… Finally… ». Ne traduis pas mot à mot : prépare les réponses directement en anglais.`]
      ],
      qs: [
        open('Walk me through the three financial statements.', `The income statement shows revenue, expenses and net income over a period. The balance sheet shows assets, liabilities and shareholders' equity at a point in time, with assets equal to liabilities plus equity. The cash flow statement starts with net income, adjusts for non-cash items like D&A and changes in working capital to get cash flow from operations, then adds cash flow from investing (capex, acquisitions) and financing (debt, equity, dividends) to get the net change in cash. Net income flows into retained earnings, and ending cash flows to the balance sheet.`, ['Income statement: performance over a period', 'Balance sheet: assets = liabilities + equity', 'Cash flow: operations, investing, financing', 'Links: net income → retained earnings, ending cash → balance sheet']),
        open('What is the difference between enterprise value and equity value?', `Equity value is the value of the company attributable to shareholders only; for a listed company it is diluted shares outstanding times the share price. Enterprise value is the value of the core operating business attributable to all capital providers, independent of capital structure. To get from equity value to enterprise value, you add debt, preferred stock and non-controlling interests, and subtract cash and non-operating assets such as equity investments.`, ['Equity value: shareholders only', 'Enterprise value: all capital providers / core operations', 'Bridge: + debt, preferred, NCI', '− cash and non-operating assets']),
        open('Walk me through a DCF.', `First, project unlevered free cash flows for five to ten years: EBIT times one minus the tax rate, plus D&A, minus capex, minus the change in net working capital. Then calculate a terminal value, using either the perpetuity growth method or an exit multiple. Discount the cash flows and the terminal value back at the WACC to get enterprise value. Finally, subtract net debt to get equity value and divide by diluted shares to get the implied share price, and run sensitivities on WACC and the growth rate.`, ['Project unlevered FCF (formula)', 'Terminal value (two methods)', 'Discount at WACC → EV', 'Net debt → equity value / share price', 'Sensitivities']),
        open('How would you value a company?', `There are three main methodologies. Comparable companies: look at trading multiples like EV/EBITDA of similar listed companies. Precedent transactions: look at multiples paid in past acquisitions of similar companies, which include a control premium. And a DCF, which values the company based on its future cash flows. You can also use an LBO analysis to see what a financial sponsor could pay. I would summarize the ranges in a football field and triangulate a valuation range.`, ['Trading comps', 'Precedent transactions (control premium)', 'DCF', 'LBO analysis', 'Football field']),

      ]
    }
  ]
});

  const ic = (n, cls) => '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[n] + '</svg>';

  /* ---------- Contenu indexé ---------- */
  const UNITS = MA.units, Q = {}, LESSONS = {}, ALLQ = [], LESSON_LIST = [];
  UNITS.forEach((u, ui) => {
    u.n = ui + 1;
    u.lessons.forEach((l, li) => {
      l.unit = u; l.n = li + 1; LESSONS[l.id] = l; LESSON_LIST.push(l);

  const AUTO = (q) => q.t !== 'open';
  const TYPE_LABEL = { mcq: 'QCM', tf: 'Vrai ou faux', num: 'Calcul', ord: 'Remets dans l’ordre', open: 'Question d’entretien' };

  /* ---------- Sauvegarde (localStorage + stockage natif sur Android) ---------- */
  const KEY = 'incollable-ma.v1';
  const DEF = () => ({ v: 1, ts: 0, xp: 0, days: {}, streak: { n: 0, last: null }, q: {}, lessons: {}, exams: [], sims: [], badges: {},
    set: { goal: 50, sound: true, haptic: true, theme: 'system', remind: null } });
  const hydrate = (o) => { const d = DEF(); o = o || {}; return Object.assign(d, o, { set: Object.assign(d.set, o.set || {}), streak: Object.assign(d.streak, o.streak || {}) }); };
  let st = DEF();
  function loadLocal() { try { const r = localStorage.getItem(KEY); if (r) return hydrate(JSON.parse(r)); } catch (e) { /* stockage indisponible */ } return null; }
  function save() {
    st.ts = Date.now();

  }

  /* ---------- XP, série, niveaux ---------- */
  const LEVELS = [[0, 'Stagiaire'], [150, 'Analyste 1'], [400, 'Analyste 2'], [800, 'Analyste 3'], [1400, 'Associate'], [2200, 'Vice President'], [3200, 'Director'], [4500, 'Managing Director']];
  function level() {
    let i = 0; while (i + 1 < LEVELS.length && st.xp >= LEVELS[i + 1][0]) i++;
    const cur = LEVELS[i][0], nxt = LEVELS[i + 1] ? LEVELS[i + 1][0] : null;
    return { i, name: LEVELS[i][1], next: LEVELS[i + 1] ? LEVELS[i + 1][1] : null, p: nxt ? (st.xp - cur) / (nxt - cur) : 1, toNext: nxt ? nxt - st.xp : 0 };
  }
  function gainXP(n) {
    n = Math.round(n); if (n <= 0) return;
    st.xp += n; const t = today(); st.days[t] = (st.days[t] || 0) + n;
    if (st.streak.last !== t) { st.streak.n = st.streak.last === addDays(t, -1) ? st.streak.n + 1 : 1; st.streak.last = t; }
  }
  const streakNow = () => { const t = today(); return st.streak.last === t || st.streak.last === addDays(t, -1) ? st.streak.n : 0; };
  const xpToday = () => st.days[today()] || 0;

  function record(q, correct) {
    const s = st.q[q.id] || (st.q[q.id] = { b: 0, due: null, ok: 0, ko: 0 });
    if (correct) { s.b = Math.min(5, s.b + 1); s.ok++; } else { s.b = 1; s.ko++; }
    s.due = addDays(today(), correct ? IV[s.b] : 0); s.last = today();
  }
  const dueList = () => ALLQ.filter((q) => { const s = st.q[q.id]; return s && s.b > 0 && s.due <= today(); });
  const weakList = () => ALLQ.filter((q) => { const s = st.q[q.id]; return s && s.ko > 0 && s.b <= 2; })
    .sort((a, b) => (qst(b.id).ko - qst(b.id).ok) - (qst(a.id).ko - qst(a.id).ok));
  const mastery = (qs) => qs.length ? qs.reduce((t, q) => t + MW[qst(q.id).b], 0) / qs.length : 0;
  const unitQs = (u) => u.lessons.flatMap((l) => l.qs);
  const masteredCount = () => ALLQ.filter((q) => qst(q.id).b >= 3).length;

  /* ---------- Feu vert entretien ---------- */
  const STAGES = ['Teaser', 'NDA', 'Phase 1', 'Phase 2', 'Signing', 'Closing'];
  const EXAM_N = 40, EXAM_PASS = 35;
  function readiness() {
    const lessonsDone = LESSON_LIST.filter((l) => st.lessons[l.id] && st.lessons[l.id].done).length;
    const pL = lessonsDone / LESSON_LIST.length;
    const m = mastery(ALLQ);
    const um = UNITS.map((u) => ({ u, m: mastery(unitQs(u)) }));
    const minU = um.reduce((a, b) => (b.m < a.m ? b : a));
    const pM = Math.min(1, m / 0.8) * 0.8 + Math.min(1, minU.m / 0.7) * 0.2;
    let streakPass = 0; for (let i = st.exams.length - 1; i >= 0 && st.exams[i].score >= EXAM_PASS; i--) streakPass++;
    const pE = Math.min(3, streakPass) / 3;
    const best = {}; st.sims.forEach((s) => { best[s.id] = Math.max(best[s.id] || 0, s.score); });
    const qual = Object.keys(best).filter((k) => best[k] >= 0.8);
    const superOk = qual.includes('s5');
    const pS = (Math.min(3, qual.filter((k) => k !== 's5').length) + (superOk ? 1 : 0)) / 4;
    const activeDays = Object.keys(st.days).filter((k) => st.days[k] > 0).length;
    const recent = [0, 1, 2].some((d) => (st.days[addDays(today(), -d)] || 0) > 0);
    const pR = Math.min(1, activeDays / 10) * (recent ? 1 : 0.9);
    const crit = [
      { t: 'Parcours terminé', s: lessonsDone + ' / ' + LESSON_LIST.length + ' leçons', p: pL, ok: pL >= 1 },
      { t: 'Maîtrise ≥ 80 %, aucune unité < 70 %', s: 'Maîtrise ' + pct(m) + ' % · unité la plus faible : ' + minU.u.title + ' (' + pct(minU.m) + ' %)', p: pM, ok: m >= 0.8 && minU.m >= 0.7 },

      { t: '4 simulations ≥ 80 %, dont le Superday', s: qual.length + ' validée' + (qual.length > 1 ? 's' : '') + ' · Superday ' + (superOk ? 'validé' : (best.s5 ? pct(best.s5) + ' %' : 'non tenté')), p: pS, ok: qual.length >= 4 && superOk },

      '<div class="eyebrow">Mandat · Entretien M&A</div>' +
      '<div class="big num" style="margin-top:8px">' + pct(R.score) + '<span style="font-size:22px"> %</span></div>' +

      '<div class="stages">' + stg + '</div><div class="stage-labels">' + lbl + '</div>' +
      (compact ? '<div class="small muted" style="margin-top:8px">' + R.crit.filter((c) => c.ok).length + ' critère' + (R.crit.filter((c) => c.ok).length > 1 ? 's' : '') + ' sur 5 validés · voir le détail</div>' : '') +

    const L = level(), R = readiness(), nl = nextLesson(), goal = st.set.goal, xt = xpToday();

          return '<button class="lesson ' + (isDone ? 'done' : '') + (isNext ? ' next' : '') + '" data-a="startLesson" data-id="' + l.id + '"><span class="node">' + (isDone ? ic('check') : isNext ? ic('play') : '<span class="num" style="font-size:13px;font-weight:700">' + u.n + '.' + l.n + '</span>') + '</span>' +
            '<span class="grow"><span class="lt" style="display:block">' + esc(l.title) + '</span><span class="small muted">' + l.cards.length + ' fiches · ' + l.qs.length + ' exercices ' + stars + '</span></span></button>';
        }).join('') + '</div>';
      }
      h += '</section>';
    });
    return h + '</main>';
  }

  /* ---------- Sessions ---------- */
  function startSession(o) {
    S = Object.assign({ i: 0, res: [], fb: null, ans: null, done: false, xp: 0, t0: Date.now() }, o);
    if (S.kind === 'lesson' && S.cards.length && !S.skipCards) { S.phase = 'cards'; S.ci = 0; } else S.phase = 'q';
    prepQ(); sheet = null; render(false);
  }
  const curQ = () => S.items[S.i];
  function prepQ() {
    S.ans = null; S.fb = null; S.reveal = false; S.ticks = {};
    const q = curQ(); if (!q) return;
    if (q.t === 'mcq') S.perm = shuffle(q.o.map((_, k) => k));
    if (q.t === 'ord') { S.perm = shuffle(q.o.map((_, k) => k)); if (S.perm.every((v, k) => v === k) && q.o.length > 1) S.perm.reverse(); S.ans = []; }
    S.qStart = Date.now();
    S.limit = S.kind === 'exam' ? ({ mcq: 35, tf: 25, num: 75, ord: 60 })[q.t] : S.kind === 'sim' ? S.sec : null;
  }
  function parseNum(s) {
    if (s == null) return NaN;
    s = String(s).replace(/[\s  ]/g, '').replace(/−/g, '-').replace(',', '.').replace(/[^0-9.\-]/g, '');
    return s === '' || s === '-' ? NaN : Number(s);
  }
  function grade(q, a) {
    if (q.t === 'mcq' || q.t === 'tf') return a === q.a;
    if (q.t === 'num') { const v = parseNum(a); if (isNaN(v)) return false; const tol = (q.tol || 0) + 1e-9; return Math.abs(v - q.a) <= tol || (q.u === '%' && Math.abs(v * 100 - q.a) <= tol); }
    if (q.t === 'ord') return a.length === q.o.length && a.every((v, k) => v === k);
    return false;
  }
  const hasAnswer = (q) => q.t === 'mcq' || q.t === 'tf' ? S.ans !== null : q.t === 'num' ? !isNaN(parseNum(S.ans)) : q.t === 'ord' ? S.ans.length === q.o.length : S.reveal;
  const correctText = (q) => q.t === 'mcq' ? q.o[q.a] : q.t === 'tf' ? (q.a ? 'Vrai' : 'Faux') : q.t === 'num' ? fmt(q.a) + (q.u ? ' ' + q.u : '') : q.t === 'ord' ? q.o.map((x, k) => (k + 1) + '. ' + x).join(' → ') : '';
  const userText = (q, a) => a == null ? 'Pas de réponse' : q.t === 'mcq' ? q.o[a] : q.t === 'tf' ? (a ? 'Vrai' : 'Faux') : q.t === 'num' ? String(a) + (q.u ? ' ' + q.u : '') : q.t === 'ord' ? a.map((k) => q.o[k]).join(' → ') : '';

  function validate(timeout) {
    const q = curQ(); if (!q || S.fb) return;
    if (q.t === 'num') { const inp = document.getElementById('numin'); if (inp) S.ans = inp.value; }
    let ok, ratio = null;
    if (q.t === 'open') { const n = q.p.length; ratio = Object.keys(S.ticks).filter((k) => S.ticks[k]).length / n; ok = ratio >= 0.6; }
    else ok = !timeout && grade(q, S.ans);
    const first = !S.retry || !S.retry[q.id];
    const time = (Date.now() - S.qStart) / 1000;
    if (first) { record(q, ok); S.res.push({ q, ok, ratio, ans: S.ans, time, ticks: Object.assign({}, S.ticks) }); }
    let xp = 0;
    if (S.kind === 'exam') xp = ok ? 2 : 0;
    else if (S.kind === 'sim') xp = q.t === 'open' ? 6 * ratio : ok ? 6 : 0;
    else xp = first ? (q.t === 'open' ? 10 * ratio : ok ? 10 : 0) : (ok ? 3 : 0);
    S.xp += xp; gainXP(xp); save();
    if (S.kind === 'lesson' && !ok && first && q.t !== 'open') { S.retry = S.retry || {}; S.retry[q.id] = true; S.items.push(q); }
    if (S.kind === 'exam') { next(); return; }
    S.fb = { ok, ratio, xp: Math.round(xp) };
    if (q.t !== 'open') { beep(ok); if (!ok) buzz(120); }
    render(true);
  }
  function next() {
    S.i++;
    if (S.i >= S.items.length) return finish();
    prepQ(); render(false);
  }
  function finish() {
    S.done = true; clearInterval(tickId);
    const firsts = S.res, n = firsts.length;
    const score = n ? firsts.reduce((t, r) => t + (r.ratio != null ? r.ratio : r.ok ? 1 : 0), 0) / n : 0;
    S.score = score;
    if (S.kind === 'lesson') {
      const prev = st.lessons[S.lesson.id] || {}, stars = score >= 0.9 ? 3 : score >= 0.7 ? 2 : 1;
      st.lessons[S.lesson.id] = { done: true, best: Math.max(prev.best || 0, score), stars: Math.max(prev.stars || 0, stars) };
      S.stars = stars; gainXP(15); S.xp += 15;
    } else if (S.kind === 'exam') {
      const good = firsts.filter((r) => r.ok).length; S.good = good;
      st.exams.push({ d: today(), score: good });
      if (good >= EXAM_PASS) { gainXP(20); S.xp += 20; }
    } else if (S.kind === 'sim') {
      st.sims.push({ id: S.sim.id, d: today(), score });
    }
    S.badges = checkBadges();
    save(); render(false);
    if ((S.kind === 'exam' && S.good >= EXAM_PASS) || (S.kind === 'lesson' && S.stars === 3) || (S.kind === 'sim' && score >= 0.8) || S.badges.includes('Feu vert')) confetti();
  }

  /* ---------- Rendu du lecteur ---------- */
  function renderPlayer() {
    if (S.done) return renderEnd();
    if (S.phase === 'cards') return renderCards();
    const q = curQ(), total = S.items.length;
    const prog = S.kind === 'lesson' ? (S.i + (S.fb ? 1 : 0)) / total : S.i / total;
    let head = '<div class="p-top"><button class="icon-btn" data-a="quitAsk" aria-label="Quitter">' + ic('x') + '</button><div class="bar thick"><i style="width:' + pct(prog) + '%"></i></div>';
    if (S.kind === 'exam' || S.kind === 'sim') head += '<span class="timer num" id="tmr">' + mmss(S.limit - (Date.now() - S.qStart) / 1000) + '</span>';
    else head += '<span class="chip brass">' + ic('bolt') + '<span class="num">' + Math.round(S.xp) + '</span></span>';
    head += '</div>';
    if (S.kind === 'exam') head += '<div style="padding:0 16px"><div class="tbar"><i id="tbar" style="width:' + Math.max(0, 100 * (1 - (Date.now() - S.qStart) / 1000 / S.limit)) + '%"></i></div></div>';
    let b = '<div class="p-body">';
    const meta = S.kind === 'exam' ? 'Question ' + (S.i + 1) + ' / ' + total : S.kind === 'sim' ? 'Question ' + (S.i + 1) + ' / ' + total + ' · ' + esc(q.unit.title) : esc(q.unit.title);
    b += '<div class="row" style="flex-wrap:wrap;gap:8px"><span class="chip qtype">' + TYPE_LABEL[q.t] + '</span><span class="small muted">' + meta + '</span></div>';
    b += '<div class="qtext ' + (q.t === 'open' ? 'lg' : '') + '">' + esc(q.q) + '</div>';
    b += answerUI(q);
    b += '</div>';
    return '<div class="player">' + head + b + footer(q) + '</div>';
  }
  function answerUI(q) {
    const fb = S.fb, lock = !!fb;
    if (q.t === 'mcq') {
      return '<div class="opts">' + S.perm.map((k, idx) => {
        let c = S.ans === k ? 'sel' : '';
        if (fb) c = k === q.a ? 'right' : S.ans === k ? 'wrong' : '';
        return '<button class="opt ' + c + '" data-a="pick" data-v="' + k + '" ' + (lock ? 'disabled' : '') + '><span class="k">' + 'ABCDEF'[idx] + '</span><span class="grow">' + esc(q.o[k]) + '</span></button>';
      }).join('') + '</div>';
    }
    if (q.t === 'tf') {
      return '<div class="tf">' + [[true, 'Vrai'], [false, 'Faux']].map(([v, l]) => {
        let c = S.ans === v ? 'sel' : '';
        if (fb) c = v === q.a ? 'right' : S.ans === v ? 'wrong' : '';
        return '<button class="opt ' + c + '" data-a="pick" data-v="' + v + '" ' + (lock ? 'disabled' : '') + '>' + l + '</button>';
      }).join('') + '</div>';
    }
    if (q.t === 'num') {
      return '<label class="numwrap"><input id="numin" type="text" inputmode="decimal" autocomplete="off" placeholder="Ta réponse" value="' + esc(S.ans || '') + '" ' + (lock ? 'disabled' : '') + ' aria-label="Ta réponse">' + (q.u ? '<span class="u">' + esc(q.u) + '</span>' : '') + '</label>' +
        '<div class="hint">' + (q.tol ? 'Tolérance : ± ' + fmt(q.tol) + (q.u && q.u !== '%' && q.u !== 'x' ? ' ' + q.u : q.u === '%' ? ' point' : '') + '. ' : '') + 'Virgule ou point acceptés. Mets un signe moins si la variation est négative.</div>';
    }
    if (q.t === 'ord') {
      const placed = S.ans || [];
      return '<div class="ordbox">' + placed.map((k, idx) => '<button class="oitem placed" data-a="unplace" data-i="' + idx + '" ' + (lock ? 'disabled' : '') + '><span class="n">' + (idx + 1) + '</span>' + esc(q.o[k]) + '</button>').join('') + '</div>' +
        '<div class="ordbank">' + S.perm.map((k) => '<button class="oitem ' + (placed.includes(k) ? 'used' : '') + '" data-a="place" data-v="' + k + '" ' + (lock ? 'disabled' : '') + '>' + esc(q.o[k]) + '</button>').join('') + '</div>' +
        (fb && !fb.ok ? '<div class="answer"><div class="eyebrow" style="margin-bottom:6px">Bon ordre</div>' + q.o.map((x, k) => '<div><b class="num">' + (k + 1) + '.</b> ' + esc(x) + '</div>').join('') + '</div>' : '');
    }
    // question ouverte
    if (!S.reveal) {
      return '<div class="card flat stack" style="gap:8px"><div class="row" style="gap:8px">' + ic('mic', 'chev') + '<b>À toi de jouer</b></div><p class="small muted" style="margin:0">Réponds à voix haute, comme face au recruteur. Structure ta réponse (2 ou 3 idées), puis compare.' + (S.kind === 'sim' ? ' Vise moins de ' + Math.round(S.sec / 60 * 10) / 10 + ' minutes.' : '') + '</p></div>';
    }
    const n = q.p.length, k = Object.keys(S.ticks).filter((x) => S.ticks[x]).length;
    return '<div class="answer"><div class="eyebrow" style="margin-bottom:6px">Réponse modèle</div>' + esc(q.r) + '</div>' +
      '<div class="eyebrow">Coche les points que tu as cités (' + k + '/' + n + ')</div><div class="points">' + q.p.map((p, i) =>
        '<button class="pt ' + (S.ticks[i] ? 'on' : '') + '" data-a="tick" data-i="' + i + '" ' + (lock ? 'disabled' : '') + '><span class="box">' + ic('check') + '</span><span class="grow">' + esc(p) + '</span></button>').join('') + '</div>';
  }
  function footer(q) {
    if (S.fb) {
      const f = S.fb;
      const title = q.t === 'open' ? (f.ok ? 'Bien couvert' : 'À retravailler') + ' · ' + pct(f.ratio) + ' % des points' : f.ok ? pick(['Exact', 'Bien joué', 'Parfait', 'Juste']) : 'Pas tout à fait';
      let ex = '';
      if (q.t !== 'open') {
        if (!f.ok) ex += '<div><b>Bonne réponse :</b> ' + esc(correctText(q)) + '</div>';
        if (q.e) ex += '<div style="margin-top:4px">' + esc(q.e) + '</div>';
      }
      return '<div class="fb ' + (f.ok ? 'ok' : 'ko') + '"><div class="fbt">' + ic(f.ok ? 'check' : 'x') + '<span class="grow">' + title + '</span>' + (f.xp ? '<span class="chip brass">+' + f.xp + ' XP</span>' : '') + '</div>' +
        (ex ? '<div class="ex">' + ex + '</div>' : '') + '<button class="btn ' + (f.ok ? '' : 'bad') + '" data-a="next">Continuer</button></div>';
    }
    if (q.t === 'open' && !S.reveal) return '<div class="p-foot"><button class="btn" data-a="reveal">Voir la réponse modèle</button></div>';
    const lbl = S.kind === 'exam' ? (S.i + 1 === S.items.length ? 'Terminer l’examen' : 'Valider et suivante') : 'Valider';
    return '<div class="p-foot"><button class="btn" data-a="validate" ' + (hasAnswer(q) || q.t === 'num' ? '' : 'disabled') + '>' + lbl + '</button></div>';
  }
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function renderCards() {
    const c = S.cards[S.ci], last = S.ci === S.cards.length - 1;
    return '<div class="player"><div class="p-top"><button class="icon-btn" data-a="quitAsk" aria-label="Quitter">' + ic('x') + '</button><div class="bar thick"><i style="width:' + pct((S.ci + 1) / (S.cards.length + 1)) + '%;background:var(--brass)"></i></div><button class="link" data-a="skipCards" style="padding:6px 8px">Exercices</button></div>' +
      '<div class="p-body"><div class="row" style="flex-wrap:wrap;gap:8px"><span class="chip">Fiche ' + (S.ci + 1) + ' / ' + S.cards.length + '</span><span class="small muted">' + esc(S.lesson.unit.title) + ' · ' + esc(S.lesson.title) + '</span></div>' +
      '<article class="lcard"><h2>' + esc(c[0]) + '</h2><div>' + c[1] + '</div></article><div class="dots">' + S.cards.map((_, i) => '<i class="' + (i === S.ci ? 'on' : '') + '"></i>').join('') + '</div></div>' +
      '<div class="p-foot row" style="gap:10px">' + (S.ci > 0 ? '<button class="btn ghost" style="width:auto" data-a="cardPrev" aria-label="Fiche précédente">' + ic('back') + '</button>' : '') +
      '<button class="btn" data-a="cardNext">' + (last ? 'C’est parti : ' + S.items.length + ' exercices' : 'Suivant') + '</button></div></div>';
  }
  function renderEnd() {
    const sc = S.score, n = S.res.length;
    let b = '<div class="p-body"><div class="result">';
    if (S.kind === 'lesson') {
      b += '<div class="eyebrow">Leçon terminée</div><h2 style="font-size:24px">' + esc(S.lesson.title) + '</h2>' +
        '<div class="stars big">' + [1, 2, 3].map((k) => '<span class="' + (k <= S.stars ? '' : 'off') + '">' + ic('star') + '</span>').join('') + '</div>';
    } else if (S.kind === 'exam') {
      const pass = S.good >= EXAM_PASS;
      b += '<div class="eyebrow">Examen blanc</div><div class="score num">' + S.good + '<small>/' + EXAM_N + '</small></div><span class="chip ' + (pass ? 'good' : 'bad') + '" style="font-size:15px;padding:7px 14px">' + (pass ? 'Réussi' : 'Échoué · seuil ' + EXAM_PASS) + '</span>';
    } else if (S.kind === 'sim') {
      b += '<div class="eyebrow">Simulation · ' + esc(S.sim.title) + '</div><div class="score num">' + pct(sc) + '<small>%</small></div><span class="chip ' + (sc >= 0.8 ? 'good' : '') + '" style="font-size:15px;padding:7px 14px">' + (sc >= 0.8 ? 'Niveau entretien atteint' : 'Objectif : 80 %') + '</span>';
    } else {
      b += '<div class="eyebrow">' + esc(S.title) + '</div><div class="score num">' + pct(sc) + '<small>%</small></div>';
    }
    const okN = S.res.filter((r) => r.ok).length;
    b += '<div class="tiles"><div class="tile"><div class="v">+' + Math.round(S.xp) + '</div><div class="l">XP gagnés</div></div><div class="tile"><div class="v">' + okN + '/' + n + '</div><div class="l">réussies</div></div><div class="tile"><div class="v">' + mmss((Date.now() - S.t0) / 1000) + '</div><div class="l">durée</div></div></div>';
    if (S.badges && S.badges.length) b += '<div class="card" style="width:100%"><div class="eyebrow">Nouveau badge</div><div style="font:700 17px var(--f-display);margin-top:4px">' + S.badges.map(esc).join(' · ') + '</div></div>';
    b += '</div>';
    if (S.kind === 'exam' || S.kind === 'sim') {
      const wrong = S.res.filter((r) => (r.ratio != null ? r.ratio < 0.6 : !r.ok));
      b += '<div class="card"><div class="eyebrow">' + (wrong.length ? 'À revoir (' + wrong.length + ')' : 'Aucune erreur') + '</div>' + wrong.map((r) =>
        '<div class="review-row"><div class="q">' + esc(r.q.q) + '</div>' + (r.q.t === 'open' ? '<div class="a muted">Points manqués : ' + esc(r.q.p.filter((_, i) => !(r.ticks && r.ticks[i])).join(' · ')) + '</div>'
          : '<div class="a y">Ta réponse : ' + esc(userText(r.q, r.ans)) + '</div><div class="a">Bonne réponse : <b>' + esc(correctText(r.q)) + '</b></div>' + (r.q.e ? '<div class="a muted">' + esc(r.q.e) + '</div>' : '')) + '</div>').join('') + '</div>';
    }
    b += '</div>';
    const again = S.kind === 'exam' ? '<button class="btn ghost" data-a="startExam">Repasser un examen</button>' : S.kind === 'sim' ? '<button class="btn ghost" data-a="startSim" data-id="' + S.sim.id + '">Relancer cette simulation</button>' : '';
    const nl = nextLesson();
    const cont = S.kind === 'lesson' && nl ? '<button class="btn" data-a="startLesson" data-id="' + nl.id + '">Leçon suivante : ' + esc(nl.title) + '</button><button class="btn ghost" data-a="exit">Retour au parcours</button>' : '<button class="btn" data-a="exit">Terminer</button>';
    return '<div class="player"><div class="p-top"><button class="icon-btn" data-a="exit" aria-label="Fermer">' + ic('x') + '</button><div class="grow"></div><span class="chip brass">' + ic('flame') + '<span class="num">' + streakNow() + '</span></span></div>' + b +
      '<div class="p-foot stack" style="gap:10px">' + cont + again + '</div></div>';
  }

  function tick() {
    if (!S || S.done || S.phase === 'cards') return;
    const left = S.limit - (Date.now() - S.qStart) / 1000;
    const t = document.getElementById('tmr');
    if (t) { t.textContent = mmss(left); t.classList.toggle('late', left < 0 || (S.kind === 'exam' && left < 8)); }
    const tb = document.getElementById('tbar'); if (tb) tb.style.width = Math.max(0, 100 * left / S.limit) + '%';
    if (S.kind === 'exam' && left <= 0) validate(true);
  }

  /* ---------- Construction des sessions ---------- */
  function lessonItems(l) { const qs = l.qs.slice(); return shuffle(qs.filter(AUTO)).concat(qs.filter((q) => !AUTO(q))); }
  function buildExam() {
    const alloc = { u1: 4, u2: 4, u3: 5, u4: 5, u5: 3, u6: 5, u7: 5, u8: 5, u10: 3, u11: 1 };
    let items = [];
    Object.keys(alloc).forEach((uid) => { const u = UNITS.find((x) => x.id === uid); items = items.concat(shuffle(unitQs(u).filter(AUTO)).slice(0, alloc[uid])); });
    return shuffle(items).slice(0, EXAM_N);
  }
  function buildSim(s) {
    let items = [];
    s.src.forEach(([uid, types, n]) => { const u = UNITS.find((x) => x.id === uid); const pool = shuffle(unitQs(u).filter((q) => types.includes(q.t) && !items.includes(q))); items = items.concat(pool.slice(0, n)); });
    const opens = items.filter((q) => q.t === 'open');
    const nums = items.filter((q) => q.t !== 'open');
    // alterne oral et calcul, fit d'abord comme dans un vrai entretien
    const fit = opens.filter((q) => q.unit.id === 'u9'), tech = shuffle(opens.filter((q) => q.unit.id !== 'u9'));
    const mixed = [...fit]; const rest = tech.slice(); nums.forEach((q, i) => rest.splice(Math.min(rest.length, i * 2 + 1), 0, q));
    return mixed.concat(rest);
  }

  /* ---------- Actions ---------- */
  const ACT = {
    tab: (d) => go(d.k),
    back: () => go(view.tab),
    sub: (d) => { view.sub = d.m; view.arg = null; render(false); },
    pickUnit: (d) => { view.sub = 'pick'; view.arg = d.m; render(false); },
    pick: (d) => { if (S) ACT.pickAns(d); },
    pickAns: (d) => { if (S.fb) return; const q = curQ(); S.ans = q.t === 'tf' ? d.v === 'true' : Number(d.v); if (st.set.haptic) buzz(8); render(true); },
    toggleUnit: (d) => { view.open = view.open === d.id ? '' : d.id; render(true); },
    startLesson: (d) => { const l = LESSONS[d.id]; startSession({ kind: 'lesson', lesson: l, cards: l.cards, items: lessonItems(l), title: l.title }); },
    startReview: (d) => {
      let items, title;
      if (d.m === 'due') { items = dueList().sort((a, b) => qst(a.id).b - qst(b.id).b).slice(0, 20); title = 'Révision du jour'; if (!items.length) { items = shuffle(ALLQ.filter(AUTO)).slice(0, 10); title = 'Sprint'; } }
      else if (d.m === 'weak') { items = weakList().slice(0, 12); title = 'Points faibles'; if (!items.length) return toast('Aucun point faible pour l’instant'); }
      else { const pool = ALLQ.filter((q) => AUTO(q)); items = shuffle(pool).slice(0, 10); title = 'Sprint'; }
      startSession({ kind: 'review', items: shuffle(items), title });
    },
    startUnit: (d) => {
      const u = UNITS.find((x) => x.id === d.id);
      let items = d.m === 'oral' ? shuffle(unitQs(u).filter((q) => q.t === 'open')).slice(0, 6)
        : shuffle(unitQs(u)).sort((a, b) => qst(a.id).b - qst(b.id).b).slice(0, 10);
      startSession({ kind: 'review', items: shuffle(items), title: u.title });
    },
    startExam: () => startSession({ kind: 'exam', items: buildExam(), title: 'Examen blanc' }),
    startSim: (d) => { const s = MA.sims.find((x) => x.id === d.id); startSession({ kind: 'sim', sim: s, sec: s.sec, items: buildSim(s), title: s.title }); },
    cardNext: () => { if (S.ci < S.cards.length - 1) { S.ci++; } else { S.phase = 'q'; prepQ(); } render(false); },
    cardPrev: () => { if (S.ci > 0) S.ci--; render(false); },
    skipCards: () => { S.phase = 'q'; prepQ(); render(false); },
    place: (d) => { if (S.fb) return; const v = Number(d.v); if (!S.ans.includes(v)) S.ans.push(v); buzz(8); render(true); },
    unplace: (d) => { if (S.fb) return; S.ans.splice(Number(d.i), 1); render(true); },
    reveal: () => { S.reveal = true; render(true); },
    tick: (d) => { if (S.fb) return; S.ticks[d.i] = !S.ticks[d.i]; buzz(8); render(true); },
    validate: () => {
      const q = curQ();
      if (q.t === 'num') { const inp = document.getElementById('numin'); const v = inp ? inp.value : ''; if (isNaN(parseNum(v))) { if (S.kind === 'exam') return validate(true); return toast('Entre un nombre'); } }
      validate(false);
    },
    next: () => next(),
    quitAsk: () => {
      if (S.kind === 'lesson' && S.phase === 'cards' && S.ci === 0) return ACT.exit();
      sheet = '<div class="sheet-bg" data-a="closeSheet"><div class="sheet" data-a="noop"><h2 style="font-size:20px">Quitter ' + (S.kind === 'exam' ? 'l’examen' : S.kind === 'sim' ? 'la simulation' : 'la séance') + ' ?</h2><p class="muted" style="margin:0">' +
        (S.kind === 'exam' ? 'L’examen ne sera pas comptabilisé.' : 'Tes réponses déjà données restent prises en compte dans ta révision.') + '</p><button class="btn" data-a="closeSheet">Continuer</button><button class="btn ghost" data-a="exit">Quitter</button></div></div>';
      render(true);
    },
    closeSheet: () => { sheet = null; render(true); },
    noop: () => {},
    exit: () => { const t = view.tab; S = null; sheet = null; go(t, view.sub, view.arg); },
    toggleSet: (d) => { st.set[d.k] = !st.set[d.k]; save(); render(true); },
    setGoal: (d) => { st.set.goal = Number(d.v); save(); render(true); },
    setTheme: (d) => { st.set.theme = d.v; applyTheme(); save(); render(true); },
    setRemind: async () => {
      const v = document.getElementById('remind').value || '19:00'; st.set.remind = v; save();
      const ok = await scheduleReminder(); render(true);
      toast(isNative ? (ok ? 'Rappel programmé à ' + v : 'Rappel enregistré') : 'Rappel enregistré, actif dans l’appli Android');
    },
    clearRemind: async () => { st.set.remind = null; save(); await scheduleReminder(); render(true); toast('Rappel désactivé'); },
    exportData: () => {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(st))));
      const ta = document.getElementById('io'); ta.hidden = false; ta.value = code;
      const done = () => toast('Sauvegarde copiée');
      try { navigator.clipboard.writeText(code).then(done, () => { ta.select(); toast('Sélectionne et copie le code'); }); } catch (e) { ta.select(); toast('Sélectionne et copie le code'); }
    },
    importOpen: () => { const ta = document.getElementById('io'); ta.hidden = false; ta.value = ''; document.getElementById('iobtn').hidden = false; ta.focus(); },
    importDo: () => {
      const v = (document.getElementById('io').value || '').trim();
      try { const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!o || typeof o.xp !== 'number') throw new Error('format'); st = hydrate(o); save(); applyTheme(); toast('Sauvegarde restaurée'); go('prog'); }
      catch (e) { toast('Code invalide : copie-le en entier, sans espace'); }
    },
    resetAsk: () => {
      sheet = '<div class="sheet-bg" data-a="closeSheet"><div class="sheet" data-a="noop"><h2 style="font-size:20px">Tout remettre à zéro ?</h2><p class="muted" style="margin:0">XP, série, leçons, examens et simulations seront effacés. Cette action est définitive.</p><button class="btn bad" data-a="resetDo">Effacer ma progression</button><button class="btn ghost" data-a="closeSheet">Annuler</button></div></div>';
      render(true);
    },
    resetDo: () => { const set = st.set; st = DEF(); st.set = set; save(); sheet = null; toast('Progression remise à zéro'); go('home'); },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const a = el.dataset.a;
    if (a === 'closeSheet' && el.classList.contains('sheet-bg') && e.target !== el) return;
    if (a === 'noop') return;
    if (ACT[a]) ACT[a](el.dataset, el, e);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'BUTTON') return;
    if (e.key === 'Enter' && S && !S.done && S.phase === 'q') {
      if (e.target.id === 'gq') return;
      e.preventDefault();
      if (S.fb) next(); else if (curQ().t === 'num') ACT.validate();
    }
    if (e.key === 'Enter' && e.target.getAttribute('role') === 'button') e.target.click();
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'gq') document.getElementById('glist').innerHTML = glossItems(e.target.value);
    if (e.target.id === 'numin' && S) {
      S.ans = e.target.value;
      const b = document.querySelector('[data-a="validate"]'); if (b) b.disabled = false;
    }
  });

  /* ---------- Toast et confettis ---------- */
  let toastT = null;
  function toast(msg) {
    const old = document.querySelector('.toast'); if (old) old.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#app').appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
  }
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; const app = $('#app'); app.appendChild(c);
    const w = c.width = app.clientWidth, h = c.height = app.clientHeight, ctx = c.getContext('2d');
    const cs = getComputedStyle(document.documentElement);
    const cols = ['--accent', '--brass', '--ink'].map((v) => cs.getPropertyValue(v).trim() || '#0B6E5B');
    const ps = Array.from({ length: 90 }, () => ({ x: w / 2 + (Math.random() - 0.5) * 80, y: h * 0.35, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 3, a: Math.random() * 6, c: cols[Math.floor(Math.random() * 3)] }));
    let f = 0;
    (function step() {
      ctx.clearRect(0, 0, w, h);
      ps.forEach((p) => { p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.a += 0.15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++f < 120) requestAnimationFrame(step); else c.remove();
    })();
  }

  /* ---------- Démarrage ---------- */
  async function boot() {
    st = loadLocal() || DEF();
    if (Cap && Cap.Preferences) {
      try { const r = await Cap.Preferences.get({ key: KEY }); if (r && r.value) { const o = hydrate(JSON.parse(r.value)); if (!st.ts || o.ts > st.ts) st = o; } } catch (e) { /* ignore */ }
    }
    applyTheme();
    if (Cap && Cap.App) {
      Cap.App.addListener('backButton', () => {
        if (sheet) { sheet = null; render(true); }
        else if (S && !S.done) ACT.quitAsk();
        else if (S) ACT.exit();
        else if (view.sub) go(view.tab);
        else if (view.tab !== 'home') go('home');
        else Cap.App.exitApp();
      });
    }
    if (Cap && Cap.StatusBar) { try { Cap.StatusBar.setOverlaysWebView({ overlay: false }); } catch (e) { /* ignore */ } }
    render(false);
  }
  window.__incollable = { get state() { return st; }, readiness, ALLQ, grade, parseNum };
  boot();
})();

</script>
